{% extends 'base.html' %}

{% block title %}Confirm Delete Certificate{% endblock %}

{% block content %}
    <h1>Delete Certificate</h1>
    <p>Are you sure you want to delete the certificate for enrollment {{ certificate.enrollment.id }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
    </form>
    <a href="{% url 'certificates:view_certificate' certificate.id %}">Cancel</a>
{% endblock %}
