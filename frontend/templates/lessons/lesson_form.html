{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1>{% if form.instance.pk %}Edit Lesson{% else %}Create Lesson{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Lesson</button>
    </form>
    <a href="{% url 'course_detail' course_id=course.id %}" class="btn btn-secondary">Cancel</a>
</div>
{% endblock %}
