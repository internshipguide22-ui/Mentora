{% extends 'base.html' %}

{% block title %}{% if form.instance.pk %}Edit Quiz{% else %}Create Quiz{% endif %}{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">{% if form.instance.pk %}Edit Quiz{% else %}Create New Quiz{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Quiz</button>
        <a href="{% url 'quizzes:quiz_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
