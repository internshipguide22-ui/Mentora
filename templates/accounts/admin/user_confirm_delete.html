{% extends "base.html" %}

{% block title %}
  Delete User
{% endblock %}

{% block content %}
  <h1>Delete User: {{ user.username }}</h1>
  <p>Are you sure you want to delete the user "{{ user.username }}"? This action cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
  </form>
  <p><a href="{% url 'accounts_admin:user_list' %}">Cancel</a></p>
{% endblock %}
