{% extends 'base.html' %}

{% block title %}Delete Question{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Delete Question</h1>
    <p>Are you sure you want to delete "{{ question.text }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'edit_quiz' question.quiz.id %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
