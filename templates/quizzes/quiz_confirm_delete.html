{% extends 'base.html' %}

{% block title %}Delete Quiz{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Delete Quiz</h1>
    <p>Are you sure you want to delete "{{ quiz.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'quizzes:quiz_detail' quiz.id %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
