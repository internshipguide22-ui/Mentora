{% extends 'base.html' %}

{% block title %}Delete Choice{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h3>Delete Choice</h3>
                </div>
                <div class="card-body">
                    <p>Are you sure you want to delete this choice?</p>
                    <div class="alert alert-warning">
                        <strong>Choice:</strong> {{ choice.text }}
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'quizzes:quiz_detail' choice.question.quiz.pk %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-danger">Delete</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
