{% extends "base.html" %}

{% block title %}
  Delete Category
{% endblock %}

{% block content %}
  <h1>Delete Category: {{ category.name }}</h1>
  <p>Are you sure you want to delete the category "{{ category.name }}"? This action cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
  </form>
  <p><a href="{% url 'courses_admin:category_list' %}">Cancel</a></p>
{% endblock %}
