{% extends 'base.html' %}

{% block title %}Express Interest in {{ course.title }}{% endblock %}

{% block content %}
<div class="container mx-auto p-4">
    <h1 class="text-3xl font-bold mb-4">Express Interest in {{ course.title }}</h1>
    <form method="post" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Submit Interest</button>
    </form>
</div>
{% endblock %}
