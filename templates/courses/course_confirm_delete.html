{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h2 class="text-2xl font-bold mb-6">Confirm Delete Course</h2>
    <div class="bg-white shadow-lg rounded-lg p-6">
        <p class="text-lg mb-4">Are you sure you want to delete the course "{{ course.title }}"?</p>
        <p class="text-red-600 mb-6">This action cannot be undone. All lessons, enrollments, and related data will be permanently deleted.</p>
        
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="bg-red-500 text-white px-6 py-3 rounded-lg hover:bg-red-600 transition duration-300">
                Yes, Delete Course
            </button>
            <a href="{% url 'course_detail' course.id %}" class="ml-4 bg-gray-500 text-white px-6 py-3 rounded-lg hover:bg-gray-600 transition duration-300">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
