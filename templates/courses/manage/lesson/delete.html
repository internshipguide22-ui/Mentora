{% extends "base.html" %}

{% block title %}
  Delete lesson
{% endblock %}

{% block content %}
  <h1>Delete lesson "{{ object.title }}"</h1>
  <p>Are you sure you want to delete "{{ object.title }}"?</p>
  <form method="post">
    {% csrf_token %}
    <input type="submit" value="Confirm delete">
  </form>
{% endblock %}
