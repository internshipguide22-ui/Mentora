{% extends 'base.html' %}

{% block title %}Delete Certificate{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Delete Certificate</h1>
    <p>Are you sure you want to delete the certificate for "{{ certificate.enrollment.course.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'list_certificates' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
