{% extends 'base.html' %}

{% block title %}Delete Content{% endblock %}

{% block content %}
    <h1>Delete "{{ object.title }}"</h1>
    <p>Are you sure you want to delete "{{ object.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
    </form>
{% endblock %}
