{% extends 'base.html' %}

{% block title %}Edit User{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="mb-4">Edit User</h1>
    
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" value="{{ edit_user.username }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ edit_user.email }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text" name="first_name" class="form-control" value="{{ edit_user.first_name }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Last Name</label>
                    <input type="text" name="last_name" class="form-control" value="{{ edit_user.last_name }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">User Type</label>
                    <select name="user_type" class="form-select" required>
                        <option value="student" {% if edit_user.user_type == 'student' %}selected{% endif %}>Student</option>
                        <option value="instructor" {% if edit_user.user_type == 'instructor' %}selected{% endif %}>Instructor</option>
                        <option value="admin" {% if edit_user.user_type == 'admin' %}selected{% endif %}>Admin</option>
                    </select>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" name="is_active" class="form-check-input" {% if edit_user.is_active %}checked{% endif %}>
                    <label class="form-check-label">Active</label>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{% url 'manage_users' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
