{% extends 'base.html' %}

{% block title %}Delete User{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="mb-4">Delete User</h1>
    
    <div class="card">
        <div class="card-body">
            <p>Are you sure you want to delete user <strong>{{ delete_user.username }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    <a href="{% url 'manage_users' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
