{% extends 'base.html' %}

{% block title %}Delete Course{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="mb-4">Delete Course</h1>
    
    <div class="card">
        <div class="card-body">
            <p>Are you sure you want to delete course <strong>{{ course.title }}</strong>?</p>
            <p class="text-danger">This will also delete all modules, lessons, and enrollments!</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    <a href="{% url 'manage_courses' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
